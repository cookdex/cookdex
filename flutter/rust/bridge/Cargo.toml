[package]
name = "cookdex-bridge"
version = "0.1.0"
edition = "2024"
publish = false

[features]
production-sync = ["cookdex-core/production-sync"]

[lib]
crate-type = ["cdylib", "staticlib", "rlib"]

[dependencies]
cookdex-core = { path = "../core" }
flutter_rust_bridge = "=2.13.0"
serde_json = "1.0"

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(frb_expand)'] }
