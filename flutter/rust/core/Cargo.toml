[package]
name = "cookdex-core"
version = "0.1.0"
edition = "2024"
rust-version = "1.90"
publish = false

[features]
production-sync = []

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
rusqlite = { version = "0.38", features = ["bundled"] }
uuid = { version = "1", features = ["v4"] }
snow = "0.10"
sha2 = "0.10"
base64 = "0.22"
if-addrs = "0.15"
chrono = { version = "0.4", default-features = false, features = ["clock"] }
regex = "1"
url = "2"
flate2 = "1.1"
crc32fast = "1.5"
